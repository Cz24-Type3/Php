<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--incluindo o bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Kali Racers</title>
    <!--Incluindo o style-->
    <link rel="stylesheet" href="Style.css">
</head>

<body>



                    <!--Menu principal-->
    <div class="areal-principal-master">
        <!--Topo-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <!--Botão do menu lateral (para o mobile)-->
                <button class="btn btn-outline-light d-md-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu-lateral-mobile"> ☰</button>
                <!--Logo do site com o link para voltar para o início-->
                <a class="navbar-brand" href="main-page.html"> <img src="Logo1.png" class="img-fluid" style="width: 40%; height: 40%;"></a>
            </div>
        </nav>
    </div>
    

    <!--Area principal-->

    <!--Tabela de usuários-->
    <table id="tabela">

        <table class="subtitulo">
            <table border="1" id="tabela" style='color:black;background-color:white;width:80%;text-align:center;margin-left: 11%;margin-top: 8%;'>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Nascimento</th>
                    <th>Sexo</th>
                    <th>Mãe</th>
                    <th>Telefone</th>
                    <th>Celular</th>
                    <th>Endereço</th>
                    <th>Email</th>
                    <th>Login</th>
                    <th>Tipo de 2FA</th>
                    <th>Resposta do 2FA</th>
                </tr>
            </thead>
        </table>
    </div>
<script>
    async function carregarEstoque() {
        const response = await fetch('listar.php');
        const dados = await response.json();
        const tbody = document.querySelector('#tabela tbody');
        tbody.innerHTML = '';

        dados.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.id}</td>
                <td><input type="text" value="${item.nome}" id="nome-${item.id}"></td>
                <td><input type="text" value="${item.tipo_de_ferramenta}" id="tipo-${item.id}"></td>
                <td><input type="text" value="${item.marca}" id="marca-${item.id}"></td>
                <td>
                    <button class="salvar" onclick="atualizar(${item.id})">💾</button>
                    <button class="deletar" onclick="deletar(${item.id})">🗑️</button>
                </td>`;
            tbody.appendChild(tr);
        });
    }
    //Carrega ao abrir
    carregarEstoque();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS.js"></script>   
</body>

<script src="JS.js"></script>
</html>
